name: Refresh YouTube View Counts

on:
  schedule:
    # Every 6 hours — 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger view count refresh
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/refresh-views" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            | grep -q "^200$"
